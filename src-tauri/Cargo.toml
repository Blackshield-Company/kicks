[package]
name = "app"
version.workspace = true
description = "Kicks Guitar Workstation — open-source guitar amp sim and effects suite"
authors = ["Kicks Contributors"]
license.workspace = true
repository = "https://github.com/synthalorian/kicks"
homepage = "https://github.com/synthalorian/kicks"
edition = "2021"
rust-version = "1.89"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
getrandom = "0.3"
dirs = "=6.0.0"
serde.workspace = true
serde_json.workspace = true
log.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tauri = { version = "2", features = ["custom-protocol"] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
chrono = { version = "0.4", features = ["serde"] }
hound.workspace = true
walkdir.workspace = true
midir.workspace = true
reqwest.workspace = true

kicks-core = { path = "../crates/kicks-core" }
kicks-dsp = { path = "../crates/kicks-dsp", features = ["cpal-backend"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Storage_FileSystem", "Win32_Foundation"] }
